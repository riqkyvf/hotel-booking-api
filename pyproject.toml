[project]
name = "hotel-booking-api"
version = "1.0.0"
description = "Hotel booking REST API for independent QA practice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic[email]>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
